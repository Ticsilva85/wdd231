<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Activities Hub</title>
    <meta name="description" content="Share your teaching ideas with English Activity Hub. Suggest creative classroom activities and help other English teachers improve their lessons.">
    <meta name="author" content="Tiago Cavalcante da Silva">

    <!-- STYLES -->
    <link rel="stylesheet" href="./styles/project-small.css"> 
    <link rel="stylesheet" href="./styles/project-larger.css">

    <!-- META CONTENT -->
    <meta property="og:title" content="English Activities Hub | Suggestions">
    <meta property="og:description" content="Share your ideas for English classroom activities and help inspire creative, engaging teaching experiences.">
    <meta property="og:image" content="https://ticsilva85.github.io/wdd231/project/images/og-image.webp">
    <meta property="og:url" content="https://ticsilva85.github.io/wdd231/project/suggest.html">
    <meta property="og:type" content="website">

    <!-- SCRIPTS -->
    <script src="./script/main.js" defer></script>
    <script src="./script/form.js"></script>
    <script src="./script/suggest.js"></script>
    <script src="./script/thankyou.js"></script>

    <!-- FAVICON -->
    <link rel="icon" href="./images/final-project-favicon.ico">

    <!-- FONTS -->
</head>
<body>
    <header>
        <img src="./images/final-project-logo.svg" alt="English Activities Hub logo">

        <a href="index.html" class="site-logo">English Activities Hub</a>

        <button
            type="button"
            class="hamburger"
            id="menu"ac
            aria-label="Open navigation menu"
            aria-controls="header-menu"
            aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav 
            class="nav-menu" 
            id="header-menu" 
            aria-label="Main Navigation">
            
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="activities.html">Activities</a></li>
                <li><a href="suggest.html" class="active" aria-current="page">Suggestions</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Suggest an Activity</h1>

        <p>
            Share your favorite English classroom activity
            with other teachers!
        </p>

        <form action="thankyou.html" method="get">
            <label for="teacher-name">Teacher's Name</label>
            <input
                type="text"
                id="teacher-name"
                name="teacherName"
                autocomplete="name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >

            <label for="activity-title">Activity Title</label>
            <input
                type="text"
                id="activity-title"
                name="activityTitle"
                required
            >

            <label for="language-level">Language Level</label>
            <input type="radio" id="language-level" name="language-level" value="beginner">
            <label for="radio-beginner">Beginner</label><br>

            <input type="radio" id="language-level" name="language-level" value="elementary">
            <label for="radio-elementary">Elementary</label><br>

            <input type="radio" id="language-level" name="language-level" value="intermediate">
            <label for="radio-intermediate">Intermediate</label><br>

            <input type="radio" id="language-level" name="language-level" value="advanced">
            <label for="radio-advanced">Advanced</label><br>


            <label for="activity-category">Activity Skills</label>
            <select
                id="activity-category"
                name="activity-category"
                required
            >
                <option value="" disabled selected>Choose a Language Skill</option>
                <option value="vocabulary">Vocabulary</option>
                <option value="grammar">Grammar</option>
                <option value="reading">Reading</option>
                <option value="writing">Writing</option>
                <option value="listening">Listening</option>
                <option value="speaking">Speaking</option>
            </select>

            <label for="activity-description">Activity Description</label>
            <input
                type="text"
                id="activity-title"
                name="activityTitle"
                required
            >

            <button type="submit">
                Submit Suggestion
            </button>
        </form>
    </main>

    <footer>
        <div class="footer-larger">
            <div class="footer-header">
                <span class="title">English Activities Hub</span>
            </div>
        </div>
            <div class="footer-notes">
                <p class="course">WDD 231: Dynamic Web Fundamentals</p>
                <p>Tiago Cavalcante | Brazil</p>
                <p>&copy; <span id="currentyear"></span> English Activities Hub</p>
                <p id="lastModified"></p>
            </div>
    </footer>
</body>
</html>
